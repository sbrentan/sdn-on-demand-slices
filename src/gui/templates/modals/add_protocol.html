<div class="modal fade" id="protocolsModal" tabindex="-1" role="dialog" aria-labelledby="protocolsModalLabel" aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="protocolsModalLabel">Select Protocol</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<form id="addProtocolForm">
					<!-- Protocol input -->
					<select class="form-control" id="protocol_select" required>
                        <option selected disabled>--- Select a protocol ---</option>
                        <option value="ICMP">ICMP</option>
                        <option value="UDP">UDP</option>
                        <option value="TCP">TCP</option>
                    </select>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
				<button type="button" class="btn btn-primary" id="saveProtocolBtn">Save</button>
			</div>
		</div>
	</div>
</div>
