<div class="modal fade" id="sendPacketModal" tabindex="-1" role="dialog" aria-labelledby="sendPacketModalLabel" aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="sendPacketModalLabel">Send Packet</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<form id="sendPacketForm">
					<!-- Protocol input -->
					<select class="form-control" id="packet-protocol_select" required>
                        <option selected disabled>--- Select a protocol ---</option>
                        <option value="UDP">UDP</option>
                        <option value="TCP">TCP</option>
                    </select><br>
					<!-- Host source input -->
					<select class="form-control" id="packet-source_select" required placeholder="Select source node">
					</select><br>
					<!-- Host destination input -->
					<select class="form-control" id="packet-dest_select" required>
					</select><br>
					<!-- Port input -->
					<input type="number" step="1" id="packet-port_input" class="form-control port-input" placeholder="Enter port">
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
				<button type="button" class="btn btn-primary" id="sendPacketBtn">Send <i class="bi bi-send"></i></button>
			</div>
		</div>
	</div>
</div>
