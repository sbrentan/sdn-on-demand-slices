<div class="modal fade" id="servicesModal" tabindex="-1" role="dialog" aria-labelledby="servicesModalLabel" aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="servicesModalLabel">Enter IP and Ports</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<form id="inputForm">
					<!-- IP Address input -->
					<div class="form-group">
						<label>IP Address</label><br>
						<input type="number" step="1" class="form-control ip-segment d-inline" min="0" max="255" id="ip1" required>
						.
						<input type="number" step="1" class="form-control ip-segment d-inline" min="0" max="255" id="ip2" required>
						.
						<input type="number" step="1" class="form-control ip-segment d-inline" min="0" max="255" id="ip3" required>
						.
						<input type="number" step="1" class="form-control ip-segment d-inline" min="0" max="255" id="ip4" required>
					</div>
					<!-- Ports input -->
					<div class="form-group">
						<label>Ports</label>
						<div id="portsContainer">
							<!-- Port pills will be appended here -->
						</div>
						<button type="button" class="btn btn-sm btn-outline-primary" id="addPortBtn">
							<i class="bi bi-plus"></i> Add Port
						</button>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
				<button type="button" class="btn btn-primary" id="saveBtn">Save</button>
			</div>
		</div>
	</div>
</div>
