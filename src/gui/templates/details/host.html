<div class="container my-4" id="host-details">
    <h3>Host Details</h3>
    <hr>
    <div class="row mb-3">
        <div class="col-md-12">
            <div class="form-group mb-3 details-form">
                <label for="host_name" class="form-label">Name</label>
                <input type="text" class="form-control editable" id="host_name" name="name" value="{{ host.name }}" readonly>
                <label for="host_mac" class="form-label">MAC Address</label>
                <input type="text" class="form-control" id="host_mac" value="{{ host.mac }}" readonly>
                <label for="host_ip" class="form-label">IPv4 Address</label>
                <input type="text" class="form-control" id="host_ip" value="{{ host.ip[0] }}" readonly>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-12">
            <h5>Actions</h5>
            <div class="row" style="padding: 0 10px;">
                <div class="col-md-4" style="padding: 0 3px;">
                    <button class="btn btn-primary confirm-btn" title="Edit" style="width: 100%;">Edit</i></button>
                </div>
                <div class="col-md-4" style="padding: 0 3px;">
                    <button class="btn btn-danger" title="Delete" style="width: 100%;">Delete <i class="bi bi-trash-fill"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    makeEditable("#host-details", onconfirm = async function(data) {
        try {
            await fetchData("", "PUT", JSON.stringify(data), "{{ Paths.HOST(host.id) }}");
            return true;
        } catch (error) {
            console.error("Failed to update host details", error);
        }
        return false;
    });
</script>
